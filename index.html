<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JPEG Squeezer - Fast Image Compressor</title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JPEG Squeezer">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    header {
      width: 100%;
      max-width: 540px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0 20px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    #install-btn {
      display: none;
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      transition: background 0.2s;
    }

    #install-btn:hover {
      background: var(--primary-hover);
    }

    .container {
      width: 100%;
      max-width: 540px;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    .dropzone {
      border: 2px dashed #93c5fd;
      background: #eff6ff;
      border-radius: var(--radius);
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .dropzone:hover {
      background: #dbeafe;
      border-color: var(--primary);
    }

    .dropzone svg {
      width: 48px;
      height: 48px;
      fill: var(--primary);
      margin-bottom: 8px;
    }

    .dropzone p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    input[type="file"] {
      display: none;
    }

    .controls {
      display: none;
      margin-top: 20px;
    }

    .control-group {
      margin-bottom: 16px;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0;
      background: var(--bg);
      padding: 12px;
      border-radius: 10px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-item span {
      font-size: 0.75rem;
      color: var(--muted);
      display: block;
    }

    .stat-item strong {
      font-size: 1rem;
      color: var(--primary);
    }

    .preview-box {
      margin-top: 14px;
      text-align: center;
    }

    .preview-box img {
      max-width: 100%;
      max-height: 250px;
      border-radius: 8px;
      object-fit: contain;
    }

    .btn-download {
      display: block;
      width: 100%;
      background: #10b981;
      color: white;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      margin-top: 16px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .btn-download:hover {
      background: #059669;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="icon-192.png" alt="JPEG Squeezer Icon">
      <h1>JPEG Squeezer</h1>
    </div>
    <button id="install-btn">📲 Install App</button>
  </header>

  <div class="container">
    <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
      <svg viewBox="0 0 24 24">
        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
      </svg>
      <h3>JPEG इमेज चुनें</h3>
      <p>या यहाँ ड्रैग करके ड्रॉप करें</p>
    </div>
    <input type="file" id="fileInput" accept="image/jpeg, image/jpg, image/png">

    <div class="controls" id="controls">
      <div class="control-group">
        <label>
          क्वालिटी (Quality):
          <span id="qualityVal">75%</span>
        </label>
        <input type="range" id="qualityRange" min="5" max="100" value="75">
      </div>

      <div class="stats">
        <div class="stat-item">
          <span>ओरिजिनल साइज</span>
          <strong id="origSize">0 KB</strong>
        </div>
        <div class="stat-item">
          <span>कंप्रेस्ड साइज</span>
          <strong id="compSize">0 KB</strong>
        </div>
      </div>

      <div class="preview-box">
        <img id="previewImg" alt="Compressed Preview">
      </div>

      <a id="downloadLink" class="btn-download" download="compressed.jpg">डाउनलोड करें</a>
    </div>
  </div>

  <!-- App Functionality & PWA Scripts -->
  <script>
    // 1. Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker Registered! Scope:', reg.scope))
          .catch((err) => console.error('Service Worker Registration Failed:', err));
      });
    }

    // 2. PWA Custom Install Prompt
    let deferredPrompt;
    const installBtn = document.getElementById('install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBtn.style.display = 'none';
        }
        deferredPrompt = null;
      }
    });

    // 3. Image Squeezer Logic
    const fileInput = document.getElementById('fileInput');
    const controls = document.getElementById('controls');
    const qualityRange = document.getElementById('qualityRange');
    const qualityVal = document.getElementById('qualityVal');
    const origSize = document.getElementById('origSize');
    const compSize = document.getElementById('compSize');
    const previewImg = document.getElementById('previewImg');
    const downloadLink = document.getElementById('downloadLink');

    let rawImage = null;
    let originalFileSize = 0;

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      originalFileSize = file.size;
      origSize.textContent = (originalFileSize / 1024).toFixed(1) + ' KB';

      const reader = new FileReader();
      reader.onload = (event) => {
        rawImage = new Image();
        rawImage.onload = () => {
          controls.style.display = 'block';
          compressImage();
        };
        rawImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    qualityRange.addEventListener('input', () => {
      qualityVal.textContent = qualityRange.value + '%';
      compressImage();
    });

    function compressImage() {
      if (!rawImage) return;

      const canvas = document.createElement('canvas');
      canvas.width = rawImage.naturalWidth;
      canvas.height = rawImage.naturalHeight;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(rawImage, 0, 0);

      const quality = qualityRange.value / 100;
      canvas.toBlob((blob) => {
        if (!blob) return;
        compSize.textContent = (blob.size / 1024).toFixed(1) + ' KB';
        const url = URL.createObjectURL(blob);
        previewImg.src = url;
        downloadLink.href = url;
      }, 'image/jpeg', quality);
    }
  </script>
</body>
</html>
